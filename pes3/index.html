<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="robots" content="noindex">
  <title>PES 3rd Grade Study Games</title>
  <link rel="icon" type="image/png" href="../images/pes-logo.png">
  <link rel="apple-touch-icon" href="../images/pes-logo.png">
  <script>
    // https only (issue #32: the grown-ups passcode needs Web Crypto, which plain http doesn't have).
    // GitHub Pages' "Enforce HTTPS" should redirect first; this covers it if not. Real host names only:
    // localhost, *.local and IP addresses (testing on a home network) are left alone.
    (function (h) {
      if (location.protocol === 'http:' && h.indexOf('.') > 0 && /[a-z]/i.test(h) && h.indexOf(':') < 0
        && !/(^|\.)localhost$|\.local$/i.test(h)) location.replace('https:' + location.href.slice(5));
    })(location.hostname);
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <button id="back" type="button" hidden>‹ Home</button>
    <h1 id="title">PES 3rd Grade Study Games</h1>
    <span id="spacer"></span>
  </header>
  <main id="app"><p class="note">Loading…</p></main>
  <script>
    // Start-up watchdog (issue #13). Plain script outside the app's modules, so it still runs if a bad offline
    // copy stops them from loading. If the app has not started within 10 s, or a script error happens before it
    // starts, ask the offline copy to compare itself with the site and reload once if it was repaired.
    (function () {
      var sw = navigator.serviceWorker, KEY = 'pes3.watchdog';
      function repair() {
        if (window.__started || !sw || !sw.controller) return;
        var last = 0;
        try { last = Number(sessionStorage.getItem(KEY) || 0); } catch (e) { /* storage blocked */ }
        if (Date.now() - last < 60000) return; // repaired and reloaded within the last minute: don't loop
        var ch = new MessageChannel();
        ch.port1.onmessage = function (e) {
          if (!e.data || !e.data.updated) return; // nothing to repair (or offline): leave the page as it is
          try { sessionStorage.setItem(KEY, String(Date.now())); } catch (err) { /* ignore */ }
          location.reload();
        };
        sw.controller.postMessage({ type: 'check', full: true }, [ch.port2]);
      }
      var tried = false;
      function once() { if (!tried) { tried = true; repair(); } }
      window.addEventListener('error', function (e) {
        if (e instanceof ErrorEvent || (e.target && /^(SCRIPT|LINK)$/.test(e.target.tagName))) once();
      }, true);
      setTimeout(once, 10000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
